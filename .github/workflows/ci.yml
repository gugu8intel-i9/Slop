name: Slop CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            slop: bin/slop
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            slop: bin/slop-linux-arm64
          - name: macOS Apple Silicon
            os: macos-latest
            slop: bin/slop-macos-arm64
          - name: macOS x86-64 (Rosetta 2)
            os: macos-latest
            slop: bin/slop-macos
          - name: Windows x86-64
            os: windows-latest
            slop: bin/slop.exe
          - name: Windows ARM64
            os: windows-11-arm
            slop: bin/slop-windows-arm64.exe
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rosetta 2
        if: matrix.slop == 'bin/slop-macos'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Test suite
        run: ${{ matrix.slop }} run tests/run.slop
      - name: gpu for (shows whether the GPU was used)
        run: ${{ matrix.slop }} run examples/gpu.slop | tail -n 1
      - name: gpu for through OpenCL (POCL, an OpenCL for the CPU)
        if: matrix.slop == 'bin/slop'
        run: |
          sudo apt-get install -y -q pocl-opencl-icd > /dev/null
          export SLOP_GPU=opencl
          SLOP_OPENCL_CPU=1 bin/slop run tests/gpu.slop > gpu-opencl.txt
          diff gpu-opencl.txt tests/expected/gpu.txt
          SLOP_OPENCL_CPU=1 bin/slop run examples/gpu.slop | tail -n 1 | tee gpu-name.txt
          grep -v "the CPU cores" gpu-name.txt
          SLOP_OPENCL_CPU=1 bin/slop run tests/matrix.slop | diff - tests/expected/matrix.txt
      - name: gpu for through Vulkan (lavapipe, a Vulkan for the CPU)
        if: matrix.slop == 'bin/slop' || matrix.slop == 'bin/slop-linux-arm64'
        run: |
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 > /dev/null
          export SLOP_GPU=vulkan SLOP_VULKAN_CPU=1
          ${{ matrix.slop }} run tests/gpu.slop > gpu-vulkan.txt
          diff gpu-vulkan.txt tests/expected/gpu.txt
          ${{ matrix.slop }} run examples/gpu.slop | tail -n 1 | tee gpu-vk-name.txt
          grep "llvmpipe" gpu-vk-name.txt
          ${{ matrix.slop }} run tests/matrix.slop | diff - tests/expected/matrix.txt
          ${{ matrix.slop }} run examples/matmul.slop 512 | grep "gpu_matmul on llvmpipe"
      - name: gpu_matmul through Metal (Apple's MPS when the GPU has it, and Slop's own kernel)
        if: matrix.slop == 'bin/slop-macos-arm64'
        run: |
          bin/slop-macos-arm64 run tests/matrix.slop | diff - tests/expected/matrix.txt
          SLOP_MPS=none bin/slop-macos-arm64 run tests/matrix.slop | diff - tests/expected/matrix.txt
          bin/slop-macos-arm64 run examples/matmul.slop 1024
      - uses: actions/setup-python@v5
        if: matrix.slop == 'bin/slop' || matrix.slop == 'bin/slop.exe'
        with:
          python-version: '3.12'
      - name: npu module through OpenVINO (its CPU device) and Core ML (its CPU mode)
        if: matrix.slop == 'bin/slop' || matrix.slop == 'bin/slop.exe' || matrix.slop == 'bin/slop-macos-arm64'
        run: |
          if [ "${{ matrix.slop }}" = "bin/slop-macos-arm64" ]; then
            export SLOP_NPU_DEVICE=CPU
          else
            python -m pip install -q openvino
            export SLOP_OPENVINO=$(python -c "import openvino, os, glob; print(sorted(glob.glob(os.path.join(os.path.dirname(openvino.__file__), 'libs', '*openvino_c*')))[0])")
            export SLOP_NPU_DEVICE=CPU
            echo "using $SLOP_OPENVINO"
          fi
          ${{ matrix.slop }} run tests/npu.slop > npu-out.txt
          cat npu-out.txt
          diff --strip-trailing-cr npu-out.txt tests/expected/npu.txt
          ${{ matrix.slop }} run examples/npu.slop | tail -n 1 | tee npu-name.txt
          grep -v "no NPU" npu-name.txt
      - name: npu module through ONNX Runtime (its CPU; on Windows ARM64, Qualcomm's QNN, which needs a Snapdragon, so it must fall back cleanly)
        if: matrix.slop == 'bin/slop' || matrix.slop == 'bin/slop.exe' || matrix.slop == 'bin/slop-windows-arm64.exe'
        run: |
          V=1.24.4
          case "${{ matrix.slop }}" in
            bin/slop)
              curl -sSfL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-linux-x64-$V.tgz
              tar xzf ort.tgz
              export SLOP_ONNXRUNTIME=$(ls $PWD/onnxruntime-linux-x64-$V/lib/libonnxruntime.so.1* | head -n 1)
              export SLOP_NPU_DEVICE=CPU ;;
            bin/slop.exe)
              curl -sSfL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-win-x64-$V.zip
              unzip -q ort.zip
              export SLOP_ONNXRUNTIME=$(cygpath -w $PWD/onnxruntime-win-x64-$V/lib/onnxruntime.dll)
              export SLOP_NPU_DEVICE=CPU ;;
            *)
              curl -sSfL -o qnn.zip https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.qnn/$V/microsoft.ml.onnxruntime.qnn.$V.nupkg
              unzip -q qnn.zip -d qnn
              export SLOP_ONNXRUNTIME=$(cygpath -w $PWD/qnn/runtimes/win-arm64/native/onnxruntime.dll)
              export SLOP_NPU_DEVICE=QNN-CPU ;;
          esac
          export SLOP_NPU_BACKEND=onnxruntime
          echo "using $SLOP_ONNXRUNTIME"
          ${{ matrix.slop }} run tests/npu.slop > npu-ort.txt 2> npu-ort-err.txt
          cat npu-ort.txt npu-ort-err.txt
          diff --strip-trailing-cr npu-ort.txt tests/expected/npu.txt
          if [ "$SLOP_NPU_DEVICE" = "QNN-CPU" ]; then
            # QNN was reached and refused this machine; Slop said so and used the GPU/CPU
            grep -q "QNN" npu-ort-err.txt
            grep -q "Slop: the NPU could not take this network" npu-ort-err.txt
          else
            # everything ran inside ONNX Runtime
            ! grep -q "Slop: the NPU" npu-ort-err.txt
            ${{ matrix.slop }} run examples/npu.slop | tail -n 1 | tee npu-ort-name.txt
            grep "ONNX Runtime CPU" npu-ort-name.txt
          fi
      - name: matmul speed (Accelerate on macOS, OpenBLAS on Linux x86-64, else Slop's own)
        run: |
          if [ "${{ matrix.slop }}" = "bin/slop" ]; then
            sudo apt-get install -y -q libopenblas0-pthread > /dev/null
          fi
          ${{ matrix.slop }} run examples/matmul.slop 1024 | tee matmul.txt
          grep -q "same answers" matmul.txt
          case "${{ matrix.slop }}" in
            bin/slop-macos-arm64|bin/slop-macos) grep -q "Accelerate" matmul.txt ;;
            bin/slop) grep -q "OpenBLAS" matmul.txt ;;
          esac
          SLOP_BLAS=none ${{ matrix.slop }} run examples/matmul.slop 1024 | head -n 1
      - name: web server under load (keep-alive and new connections, no failures allowed)
        if: matrix.slop == 'bin/slop' || matrix.slop == 'bin/slop-linux-arm64' || matrix.slop == 'bin/slop-macos-arm64'
        run: |
          if ! command -v ab > /dev/null; then sudo apt-get install -y -q apache2-utils > /dev/null; fi
          printf 'use "web"\nfn handle(req: Request) -> Response {\n    return text("hello")\n}\nquiet()\nserve(18631)\n' > load.slop
          ${{ matrix.slop }} load.slop load-server
          ./load-server &
          sleep 1
          ab -q -k -n 20000 -c 100 http://127.0.0.1:18631/ | tee ab1.txt | grep -E "Requests per second|Failed requests"
          ab -q -n 5000 -c 50 http://127.0.0.1:18631/ | tee ab2.txt | grep -E "Requests per second|Failed requests"
          kill %1
          grep -q "Failed requests: *0" ab1.txt
          grep -q "Failed requests: *0" ab2.txt
          grep -q "Complete requests: *20000" ab1.txt
      - name: https to a real site (system certificates and name lookup)
        run: ${{ matrix.slop }} run examples/fetch.slop https://github.com/
